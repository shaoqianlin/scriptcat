services:
  - type: web
    name: boomcat
    runtime: node
    plan: free
    rootDir: mvp
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.18.1"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: API_URL
        value: https://api.deepseek.com/v1/chat/completions
      - key: MODEL
        value: deepseek-chat
